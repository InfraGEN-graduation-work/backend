name: infragen CD with OCI

on:
  push:
    branches: [ "develop" ] # develop 브랜치에 코드가 올라오면 실행

jobs:
  build-and-push:
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      # 소스 코드 가져오기
      - name: Checkout
        uses: actions/checkout@v4

      # 도커 빌드 도구 설정
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 도커 허브 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 도커 이미지 빌드 및 저장소 업로드(Push)
      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/infragen-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push # 빌드/푸시가 성공해야 실행
    permissions:
      contents: read
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    steps:
      # 소스 코드 가져오기
      - name: Checkout
        uses: actions/checkout@v4

      # .env 파일 생성
      - name: Create .env file
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          printf '%s\n' "$ENV_FILE" > .env

      # 배포 파일을 덮어쓰기 전에 서버의 rollback 기준을 만든다.
      - name: Copy OCI deployment script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_VM_IP }}
          username: ${{ secrets.OCI_VM_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          source: "scripts/deploy-oci.sh"
          target: "~/infragen"
      
      # 배포 전 rollback을 위한 백업을 준비한다.
      - name: Prepare rollback backup on OCI
        env:
          DEPLOY_ID: ${{ github.run_id }}-${{ github.sha }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_VM_IP }}
          username: ${{ secrets.OCI_VM_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          envs: DEPLOY_ID
          script: |
            cd "$HOME/infragen"
            bash scripts/deploy-oci.sh prepare

      # docker-compose.yaml, nginx 설정 파일, .env 파일을 서버로 복사
      - name: Copy files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_VM_IP }}
          username: ${{ secrets.OCI_VM_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          source: "docker-compose.yaml,nginx/default.conf,.env"
          target: "~/infragen"

      # SSH로 오라클 서버에 접속하여 배포 명령 실행
      - name: Deploy to OCI via SSH
        env:
          DEPLOY_ID: ${{ github.run_id }}-${{ github.sha }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_DIGEST: ${{ needs.build-and-push.outputs.image_digest }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_VM_IP }}
          username: ${{ secrets.OCI_VM_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          envs: DEPLOY_ID,DOCKERHUB_USERNAME,IMAGE_DIGEST
          script: |
            cd "$HOME/infragen"
            bash scripts/deploy-oci.sh deploy

      - name: Remove generated .env from runner
        if: always()
        run: rm -f .env
