name: infragen CI/CD with OCI

on:
  push:
    branches: [ "develop" ] # develop 브랜치에 코드가 올라오면 실행

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # 소스 코드 가져오기
      - name: Checkout
        uses: actions/checkout@v4

      # Java 21 및 빌드 환경 설정
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # 빌드 도구(gradlew) 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 단위 테스트 실행
      - name: Test with Gradle
        run: ./gradlew test --no-daemon

      # 도커 빌드 도구 설정
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 도커 허브 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 도커 이미지 빌드 및 저장소 업로드(Push)
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/infragen-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/infragen-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push # 빌드/푸시가 성공해야 실행
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    steps:
      # 소스 코드 가져오기
      - name: Checkout
        uses: actions/checkout@v4

      # .env 파일 생성
      - name: Create .env file
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env

      # docker-compose.yaml, nginx 설정 파일, .env 파일을 서버로 복사
      - name: Copy files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_VM_IP }}
          username: ${{ secrets.OCI_VM_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          source: "docker-compose.yaml,nginx/default.conf,.env"
          target: "~/infragen"

      # SSH로 오라클 서버에 접속하여 배포 명령 실행
      - name: Deploy to OCI via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_VM_IP }}
          username: ${{ secrets.OCI_VM_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            # 디렉토리 생성 및 이동
            mkdir -p ~/infragen
            cd ~/infragen
            
            # 환경 변수 설정 후 docker-compose 실행
            export DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"
            
            # 최신 이미지 내려받기
            docker-compose pull infragen-app
            
            # 전체 서비스 재시작 및 재생성
            docker-compose up -d
            
            # 찌꺼기 이미지 정리 및 실행 상태 확인
            docker image prune -f
            docker-compose ps
            
            # 헬스 체크 검증 루프 (최대 10회)
            echo "Waiting for infragen-app to boot..."
            for i in {1..10}; do
              RESPONSE=$(curl -s http://127.0.0.1:8080/health || true)
              if [ "$RESPONSE" = "UP" ]; then
                echo "Health check passed successfully!"
                exit 0
              fi
              if [ $i -eq 10 ]; then
                echo "Health check failed after 10 retries."
                docker-compose logs infragen-app
                exit 1
              fi
              echo "Retrying health check in 5 seconds..."
              sleep 5
            done
